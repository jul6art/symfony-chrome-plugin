<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="panel.css">
  </head>
  <body>
    <header class="toolbar">
      <input id="filter" type="search" placeholder="Filter (URL, method, status)" spellcheck="false">
      <label><input id="xhrOnly" type="checkbox" checked> XHR/fetch only</label>
      <label><input id="follow" type="checkbox" checked> Follow latest</label>
      <label title="Show %5B as [, %20 as space…"><input id="decode" type="checkbox" checked> Decode URLs</label>
      <label><input id="preserve" type="checkbox"> Preserve log</label>
      <button id="latestProfiler" type="button" disabled>Latest profiler ↗</button>
      <button id="clear" type="button">Clear</button>
      <span id="count" class="muted"></span>
    </header>

    <main class="split">
      <section class="list-pane">
        <ul id="list" class="list" tabindex="0"></ul>
        <p id="empty" class="empty muted">Waiting for requests… Keep DevTools open while you use the app.</p>
      </section>

      <section id="detail" class="detail-pane">
        <p class="empty muted">Select a request.</p>
      </section>
    </main>

    <script src="panel.js"></script>
  </body>
</html>
